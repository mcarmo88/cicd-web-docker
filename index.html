<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel da Equipa — Demo CI/CD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>🚀 Painel da Equipa</h1>
    <p class="subtitle">Esta página é construída e publicada automaticamente por um pipeline de CI/CD.</p>

    <section>
      <h2>Quem já passou por aqui</h2>
      <ul id="team-list">
        <li>Adiciona o teu nome aqui! 👋</li>
      </ul>
    </section>

    <section>
      <h2>Frase do dia (via API)</h2>
      <p id="quote">A carregar...</p>
    </section>

    <footer>
      <p>Última publicação: <span id="build-info">Build #9 · 2026-09-29 10:10 UTC · commit 012e8ac</span></p>
    </footer>
  </main>

  <script>
    fetch('/api/quote')
      .then(r => { if (!r.ok) throw new Error('resposta não OK'); return r.json(); })
      .then(data => {
        document.getElementById('quote').textContent = data.quote;
      })
      .catch(() => {
        document.getElementById('quote').textContent =
          'API não disponível aqui (normal no GitHub Pages, que só serve ficheiros ' +
          'estáticos). Corre "docker compose up" ou o exemplo de Kubernetes para ' +
          'veres a API em ação.';
      });
  </script>
</body>
</html>
