apiVersion: apps/v1
kind: Deployment
metadata:
  name: painel
spec:
  replicas: 3            # estado DESEJADO: 3 pods sempre a correr
  selector:
    matchLabels:
      app: painel
  template:
    metadata:
      labels:
        app: painel
    spec:
      containers:
        - name: painel
          # Troca TEU-UTILIZADOR/NOME-DO-REPO (tudo em minúsculas). O pacote tem de ser público.
          # Alternativa: imagem construída localmente (docker build -t painel-equipa .)
          # image: painel-equipa:latest
          # imagePullPolicy: Never
          ports:
            - containerPort: 80
