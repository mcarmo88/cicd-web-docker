name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write   # necessário para publicar no GitHub Pages
  packages: write   # necessário para publicar a imagem no GitHub Container Registry

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # --- FASE 1: LINT (verificação de qualidade, não são testes) ---
      - name: Verificar qualidade do HTML
        run: npx --yes htmlhint index.html

      # --- FASE 2: CARIMBO (o pipeline altera a página automaticamente) ---
      - name: Carimbar página com info do build
        run: |
          BUILD_INFO="Build #${{ github.run_number }} · $(date -u +'%Y-%m-%d %H:%M UTC') · commit ${GITHUB_SHA::7}"
          sed -i "s|PLACEHOLDER_BUILD_INFO|$BUILD_INFO|" index.html

      # --- FASE 3: VALIDAÇÃO DOS DOCKERFILES (boas práticas, não são testes) ---
      - name: Lint ao Dockerfile da web (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Lint ao Dockerfile da API (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: api/Dockerfile

      # --- FASE 4: IMAGENS DOCKER (build + publicação no registry) ---
      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar imagem da web
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}-web:latest

      - name: Construir e publicar imagem da API
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: ghcr.io/${{ github.repository }}-api:latest

      # --- FASE 5: VULNERABILIDADES NAS IMAGENS (Trivy) ---
      - name: Scan de vulnerabilidades — imagem web
        uses: aquasecurity/trivy-action@57a97c7e
        with:
          image-ref: ghcr.io/${{ github.repository }}-web:latest
          severity: CRITICAL,HIGH
          exit-code: '0'   # muda para '1' depois de confirmares o resultado, para bloquear o deploy

      - name: Scan de vulnerabilidades — imagem API
        uses: aquasecurity/trivy-action@57a97c7e
        with:
          image-ref: ghcr.io/${{ github.repository }}-api:latest
          severity: CRITICAL,HIGH
          exit-code: '0'

      # --- FASE 6: DEPLOY (publica a página no GitHub Pages) ---
      - name: Preparar pasta de publicação
        run: |
          mkdir -p dist
          cp index.html style.css dist/

      - name: Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
