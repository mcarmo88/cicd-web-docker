# API + 3 réplicas da aplicação web, com reinício automático se um container morrer.
# Portas 8080-8082 (web) e a API acessível internamente como "api:3000".
services:
  api:
    build: ./api
    image: painel-api
    restart: always

  web:
    build: .
    image: painel-equipa
    ports:
      - "8080-8082:80"
    deploy:
      replicas: 3
    restart: always
    depends_on:
      - api
